<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results — SnowPro Core Practice Exam</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="container">
      <div class="app-title">
        <span class="snowflake-icon">&#10052;</span>
        SnowPro Core Practice Exam
      </div>
    </div>
  </header>

  <!-- Loading screen -->
  <div class="loading-screen" id="loading-screen">
    <div class="loading-spinner"></div>
    <p>Calculating results...</p>
  </div>

  <main class="container hidden" id="results-main">
    <!-- Score Hero -->
    <div class="results-hero" id="results-hero">
      <div class="results-score" id="results-score">0%</div>
      <div class="results-label" id="results-label">0 of 0 correct</div>
      <div class="results-badge" id="results-badge">--</div>
      <div class="results-stats">
        <div class="stat-item">
          <div class="stat-value" id="stat-time">--:--</div>
          <div class="stat-label">Time Taken</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-correct">0</div>
          <div class="stat-label">Correct</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="stat-incorrect">0</div>
          <div class="stat-label">Incorrect</div>
        </div>
      </div>
    </div>

    <!-- Domain Breakdown -->
    <div class="card">
      <div class="card-title">Domain Breakdown</div>
      <table class="domain-table" id="domain-table">
        <thead>
          <tr>
            <th>Domain</th>
            <th>Score</th>
            <th>Progress</th>
          </tr>
        </thead>
        <tbody id="domain-tbody">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>

    <!-- Actions -->
    <div class="results-actions">
      <button class="btn btn-primary" onclick="retakeSame()">&#128260; Retake Same</button>
      <button class="btn btn-success" onclick="newQuiz()">&#10133; New Quiz</button>
      <button class="btn btn-outline" onclick="backToSetup()">&#127968; Back to Setup</button>
    </div>

    <!-- Question Review -->
    <div class="card">
      <div class="card-title">Question Review</div>
      <div id="review-list">
        <!-- Populated by JS -->
      </div>
    </div>
  </main>

  <script src="js/results.js"></script>
</body>
</html>
